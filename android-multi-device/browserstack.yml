# =============================
# Set BrowserStack Credentials
# =============================
# Add your BrowserStack userName and acccessKey here or set BROWSERSTACK_USERNAME and
# BROWSERSTACK_ACCESS_KEY as env variables
userName: BROWSERSTACK_USERNAME
accessKey: BROWSERSTACK_ACCESS_KEY

# ======================
# BrowserStack Reporting
# ======================
# The following capabilities are used to set up reporting on BrowserStack:
# Set 'projectName' to the name of your project. Example, Marketing Website
projectName: BrowserStack Samples
# Set `buildName` as the name of the job / testsuite being run
buildName: browserstack multi-device build
# `buildIdentifier` is a unique id to differentiate every execution that gets appended to
# buildName. Choose your buildIdentifier format from the available expressions:
# ${BUILD_NUMBER} (Default): Generates an incremental counter with every execution
# ${DATE_TIME}: Generates a Timestamp with every execution. Eg. 05-Nov-19:30
# Read more about buildIdentifiers here -> https://www.browserstack.com/docs/automate/selenium/organize-tests
buildIdentifier: '#${BUILD_NUMBER}' # Supports strings along with either/both ${expression}

# =====================================================================
# Multi-device / multi-driver setup (two concurrent App Automate sessions)
# =====================================================================
# This sample builds TWO WebDriver sessions concurrently from a single Node
# process using the browserstack-node-sdk's multi-driver feature. Each device
# is assigned a `label` under `platforms` / `additionalPlatforms`, and the test
# calls `BrowserStackSdk.setDriverLabel('<label>')` immediately before each
# `new webdriver.Builder().build()` call so the SDK knows which capability set
# to use for that particular build.
#
# IMPORTANT: the PRIMARY device's `app` MUST stay a top-level `app:` key (the
# same field single-device samples use) — it must NOT be nested under its own
# entry in `platforms:`. Only the SECONDARY device's `app` goes under its own
# `additionalPlatforms[0].app` entry; that is the only place the SDK reads a
# per-platform `app` for anything other than the primary device. Nesting the
# primary's app under `platforms[0].app` instead of top-level causes the first
# `build()` call to fail with
# `TypeError: Target browser must be a string, but is undefined`.

# Set `app` to define the app used for the PRIMARY (first) device.
# It can either take the id of any uploaded app or the path of the app directly.
app: ./CustomerApp-debug.apk

# =======================================
# Platforms (Browsers / Devices to test)
# =======================================
# `platforms` describes the PRIMARY device. Its `app` is taken from the
# top-level `app` key above — do not add an `app` field here.
platforms:
  - label: driver#1
    deviceName: Samsung Galaxy S22 Ultra
    osVersion: 12.0
    platformName: android

# `additionalPlatforms` describes every SECONDARY device. Unlike the primary,
# each entry here reads its own `app` field directly.
additionalPlatforms:
  - label: driver#2
    deviceName: Samsung Galaxy S22 Ultra
    osVersion: 12.0
    platformName: android
    app: ./RiderApp-debug.apk

# ==========================================
# BrowserStack Local
# (For localhost, staging/private websites)
# ==========================================
# Set browserStackLocal to true if your website under test is not accessible publicly over the internet
# Learn more about how BrowserStack Local works here -> https://www.browserstack.com/docs/automate/selenium/local-testing-introduction
browserstackLocal: false # <boolean> (Default false)

# ===================
# Debugging features
# ===================
debug: false # <boolean> # Set to true if you need screenshots for every selenium command ran
networkLogs: false # <boolean> Set to true to enable HAR logs capturing
consoleLogs: errors # <string> Remote browser's console debug levels to be printed (Default: errors)
# Available options are `disable`, `errors`, `warnings`, `info`, `verbose` (Default: errors)
